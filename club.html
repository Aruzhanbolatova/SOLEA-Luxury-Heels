<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLEA Club</title>
</head>
<body>
    <p><a href="index.html#solea-club">Open SOLEA Club on Home</a></p>
    <script>
        const destination = new URL('index.html', location.href);
        const view = new URLSearchParams(location.search).get('view');
        destination.searchParams.set('club', view === 'sign-in' ? 'sign-in' : 'register');
        destination.hash = 'solea-club';
        location.replace(destination);
    </script>
</body>
</html>
